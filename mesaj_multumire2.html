<!DOCTYPE html><html lang='ro'><head><meta charset='UTF-8'><title>Mulțumesc</title><style>* { margin:0; padding:0; box-sizing:border-box; }body {  height:100vh; overflow:hidden;  display:flex; flex-direction:column;  align-items:center; justify-content:center;  font-family:'Georgia', serif;  background: radial-gradient(circle at top, #fff6e5, #ffe0ec 60%, #ffd1dc);  text-align:center; position:relative;}.floare {  font-size:100px;  animation: rotate 4s linear infinite;}@keyframes rotate {  from {transform:rotate(0deg);}  to {transform:rotate(360deg);}}h1 {  font-size:3em; color:#b5406a;  margin:20px 0 10px;  animation: fadeIn 1.5s ease;}p {  font-size:1.2em; color:#6d4c58;  max-width:480px; line-height:1.6;  animation: fadeIn 2.5s ease;}@keyframes fadeIn {  from {opacity:0; transform:translateY(15px);}  to {opacity:1; transform:translateY(0);}}.confetti {  position:absolute; top:-10px;  font-size:1.5em;  animation: fall linear infinite;}@keyframes fall {  to { transform:translateY(110vh) rotate(360deg); }}</style></head><body><div class='floare'>🌸</div><h1>Mulțumesc din suflet!</h1><p>Fiecare urare pentru ziua mea a însemnat enorm pentru mine. Sunt norocoasă/norocos să am oameni atât de minunați alături. Vă mulțumesc! 💕</p><div class='confetti' style='left:5%; animation-duration:4s;'>🎈</div><div class='confetti' style='left:20%; animation-duration:6s;'>🌷</div><div class='confetti' style='left:40%; animation-duration:5s;'>✨</div><div class='confetti' style='left:60%; animation-duration:7s;'>🎀</div><div class='confetti' style='left:80%; animation-duration:4.5s;'>🌸</div><div class='confetti' style='left:90%; animation-duration:5.5s;'>💐</div></body></html>
