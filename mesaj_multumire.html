<!DOCTYPE html><html lang='ro'><head><meta charset='UTF-8'><title>Mulțumesc</title><style>body {  margin:0; padding:0;  height:100vh;  display:flex; flex-direction:column;  align-items:center; justify-content:center;  font-family:'Segoe UI', sans-serif;  background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);  background-size: 400% 400%;  animation: gradientBG 10s ease infinite;  text-align:center;}@keyframes gradientBG {  0% {background-position:0% 50%;}  50% {background-position:100% 50%;}  100% {background-position:0% 50%;}}img {  width:180px; height:180px;  border-radius:50%;  border:5px solid white;  box-shadow:0 8px 20px rgba(0,0,0,0.3);  margin-bottom:20px;  animation: pop 1.2s ease;}@keyframes pop {  0% {transform:scale(0); opacity:0;}  70% {transform:scale(1.1);}  100% {transform:scale(1); opacity:1;}}h1 {  font-size:2.8em; color:#4a2c5e;  text-shadow:2px 2px 6px rgba(255,255,255,0.6);  margin:10px 0;  animation: fadeInUp 1.5s ease;}p {  font-size:1.3em; color:#3d2c4a;  max-width:500px;  animation: fadeInUp 2s ease;}@keyframes fadeInUp {  from {opacity:0; transform:translateY(20px);}  to {opacity:1; transform:translateY(0);}}.emoji {  font-size:2em;  animation: bounce 2s infinite;}@keyframes bounce {  0%,100% {transform:translateY(0);}  50% {transform:translateY(-15px);}}</style></head><body><img src='poza.jpg' alt='tort aniversar'><h1>🎉 Mulțumesc pentru urări! 🎂</h1><p>Ați făcut ziua mea de naștere mult mai frumoasă. Fiecare gând bun și fiecare mesaj a contat enorm pentru mine. Vă mulțumesc din suflet!</p><div class='emoji'>🎈 🎁 ✨</div></body></html>
